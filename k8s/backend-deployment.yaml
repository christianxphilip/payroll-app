          value: "your-super-secret-jwt-key-change-in-production"
        - name: AUTH_PASSWORD
          value: "admin123"
        - name: NODE_ENV
          value: "development"
        - name: PAYSLIP_LOGO_PATH
          value: "/app/assets/logo.png"
        - name: EMAIL_USER
          value: "espressionistmarketing@gmail.com"
        - name: EMAIL_PASS
