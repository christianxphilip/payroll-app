apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-backend
  labels:
    app: payroll-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-backend
  template:
    metadata:
      labels:
        app: payroll-backend
    spec:
      containers:
      - name: backend
        image: payroll-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9001
        env:
        - name: PORT
          value: "9001"
        - name: MONGODB_URI
