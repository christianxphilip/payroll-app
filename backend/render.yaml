services:
  - type: web
    name: espro-payroll-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 9001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_PASSWORD
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
